plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // The Google services Gradle plugin
    id 'com.google.gms.google-services'
}

// FlutterFire supplies compatible native Firebase dependencies.

def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    dartDefines = dartDefines + project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=', 2)
                pair.length == 2 ? [(pair[0]): pair[1]] : [:]
            }
}

// Signing credentials are build-only inputs, never Dart defines or app assets.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningKeys = signingKeys.findAll { !keystoreProperties.getProperty(it)?.trim() }
def releaseKeystore = keystoreProperties.getProperty('storeFile')?.trim()

def validateReleaseCredentials = tasks.register('validateReleaseCredentials') {
    doLast {
        if (!missingSigningKeys.isEmpty()) {
            throw new GradleException("Android release signing requires android/key.properties. Missing: ${missingSigningKeys.join(', ')}. See android/key.properties.example. Debug/profile builds do not require release credentials.")
        }
        if (!rootProject.file(releaseKeystore).isFile()) {
            throw new GradleException("The storeFile in android/key.properties does not point to an existing keystore.")
        }
    }
}
// Validate only when a release build is actually executed, not during IDE sync.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild' || task.name == 'validateSigningRelease') {
        task.dependsOn(validateReleaseCredentials)
    }
}

android {
    buildFeatures {
        resValues true
    }

    namespace = "com.theberridge.mill_road_winter_fair_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.theberridge.mill_road_winter_fair_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Only the native Maps SDK needs an Android resource. All other app
        // settings are read directly from compile-time declarations in Dart.
        resValue "string", "ANDROID_GOOGLE_MAPS_SDK_API_KEY",
                dartDefines['ANDROID_GOOGLE_MAPS_SDK_API_KEY'] ?: ""
    }

    signingConfigs {
        release {
            storeFile releaseKeystore ? rootProject.file(releaseKeystore) : null
            storePassword keystoreProperties.getProperty('storePassword')
            keyAlias keystoreProperties.getProperty('keyAlias')
            keyPassword keystoreProperties.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            ndk {
                // Enable debug symbols for native code
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            signingConfig signingConfigs.release
            minifyEnabled true // Enable for optimization
            shrinkResources true // Remove unused resources
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
